<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <title>BajSAS Twitch login</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0b1220;color:#e8eef7;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .box{text-align:center;padding:24px;max-width:360px}
    .spin{width:28px;height:28px;border:3px solid rgba(145,70,255,.3);border-top-color:#9146ff;border-radius:50%;margin:0 auto 14px;animation:sp .9s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .err{color:#ff8a80;font-size:13px}
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <div id="msg">Connecting to Twitch…</div>
  </div>
  <script src="./oauth.js" defer></script>
</body>
</html>
